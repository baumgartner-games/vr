name: Lint (wöchentlich)

# **Lint und Format laufen einmal die Woche und nicht bei jedem Push.** Sie
# kosteten im Job `Build` zusammen fast eine Minute — bei jedem Push und jedem
# Pull Request, für Befunde, die nichts kaputt machen. Hier laufen sie montags
# früh (und auf Knopfdruck), und nur, wenn sich seit dem letzten grünen Lauf
# etwas geändert hat: Verglichen wird mit dem Commit des letzten grünen Laufs,
# den GitHub selbst kennt. Ist der Stand derselbe, gibt es nichts zu tun.
#
# Früher schrieb der Lauf den geprüften Commit in `.github/lint-commit` und
# schob das auf `main`. Das lehnt die Regel für `main` ab (der Check `Build`
# fehlt an so einem Commit), deshalb merkt sich der Lauf nichts mehr im Repo.
#
# Ein roter Lauf zählt nicht als geprüft, und GitHub meldet ihn — repariert wird mit `npm run lint` und
# `npm run format` (`AGENTS.md`, „Linter und Formatierer").

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lint
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Ein übersprungener Lauf zählt auch als grün. Das stimmt, denn er hatte
      # denselben Stand wie ein grüner Lauf davor.
      - name: Schon geprüft?
        id: seen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow lint.yml \
            --status success --limit 1 --json headSha -q '.[0].headSha // empty')
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null \
            && git diff --quiet "$last" HEAD; then
            echo "Seit $last hat sich nichts geändert."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.seen.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.seen.outputs.skip != 'true'
        run: npm ci

      - name: Lint
        if: steps.seen.outputs.skip != 'true'
        run: npm run lint

      - name: Format check
        if: steps.seen.outputs.skip != 'true'
        run: npm run format:check

