name: Browser smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the built game
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/orbital-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/orbital-preview.log
          exit 1
      - name: Exercise roles, tools, restart and bot
        run: npm run test:browser -- --browser=chromium --software --no-screenshots --loops=1 --bot-seconds=15 --url=http://127.0.0.1:4173/ --output=.artifacts/browser-smoke/ci
      - name: Save browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-browser-review
          path: .artifacts/browser-smoke/ci
          if-no-files-found: warn
          retention-days: 14
