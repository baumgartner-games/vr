<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Baumgartner VR">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0d1c"/>
      <stop offset="55%" stop-color="#141a35"/>
      <stop offset="100%" stop-color="#1d1230"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d1230" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2a1745" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="blueCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfe9ff"/>
      <stop offset="45%" stop-color="#3aa6ff"/>
      <stop offset="100%" stop-color="#0b3a7a" stop-opacity="0.25"/>
    </radialGradient>
    <radialGradient id="orangeCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe3bf"/>
      <stop offset="45%" stop-color="#ff8a2b"/>
      <stop offset="100%" stop-color="#7a2f05" stop-opacity="0.25"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ad4ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffb066"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>

  <g opacity="0.75" fill="#ffffff">
    <circle cx="120" cy="70" r="1.6"/><circle cx="300" cy="46" r="1.2"/>
    <circle cx="520" cy="88" r="1.4"/><circle cx="760" cy="54" r="1.1"/>
    <circle cx="980" cy="96" r="1.5"/><circle cx="1120" cy="60" r="1.2"/>
    <circle cx="200" cy="150" r="1"/><circle cx="1040" cy="170" r="1"/>
  </g>

  <rect y="250" width="1200" height="170" fill="url(#floor)"/>
  <g stroke="#5b3fa8" stroke-opacity="0.55" stroke-width="1.2" fill="none">
    <path d="M600 250 L-260 420"/><path d="M600 250 L60 420"/><path d="M600 250 L330 420"/>
    <path d="M600 250 L600 420"/><path d="M600 250 L870 420"/><path d="M600 250 L1140 420"/>
    <path d="M600 250 L1460 420"/>
    <path d="M0 272 H1200" stroke-opacity="0.3"/>
    <path d="M0 300 H1200" stroke-opacity="0.35"/>
    <path d="M0 340 H1200" stroke-opacity="0.4"/>
    <path d="M0 390 H1200" stroke-opacity="0.45"/>
  </g>

  <g filter="url(#glow)">
    <ellipse cx="196" cy="222" rx="86" ry="128" fill="url(#blueCore)" opacity="0.95"/>
    <ellipse cx="196" cy="222" rx="86" ry="128" fill="none" stroke="#8fd4ff" stroke-width="5" opacity="0.9"/>
    <ellipse cx="1004" cy="222" rx="86" ry="128" fill="url(#orangeCore)" opacity="0.95"/>
    <ellipse cx="1004" cy="222" rx="86" ry="128" fill="none" stroke="#ffc48a" stroke-width="5" opacity="0.9"/>
  </g>

  <g filter="url(#softGlow)" opacity="0.9">
    <path d="M300 232 C 460 200, 740 200, 900 232" fill="none" stroke="#9aa8ff" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="10 14"/>
  </g>

  <g transform="translate(600 196)" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text y="0" font-size="76" font-weight="700" letter-spacing="6" fill="url(#title)" filter="url(#softGlow)">BAUMGARTNER VR</text>
    <text y="44" font-size="23" letter-spacing="4" fill="#b9c2e8" opacity="0.9">WebXR-Spielwiese · three.js + TypeScript</text>
    <g transform="translate(0 92)">
      <rect x="-118" y="-25" width="236" height="50" rx="25" fill="#ffffff" fill-opacity="0.07" stroke="#8fd4ff" stroke-opacity="0.7" stroke-width="1.5"/>
      <text y="7" font-size="21" letter-spacing="3" font-weight="600" fill="#e8f4ff">▶ ENTER VR</text>
    </g>
  </g>
</svg>
