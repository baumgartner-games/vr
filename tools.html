<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05070d" />
    <title>Werkzeuge — Baumgartner VR</title>
    <meta name="description" content="Alle Werkzeuge der VR-Spielwiese: Übersicht, 3D-Ansicht zum Drehen und die Boxhand am Griff." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%94%A7%3C/text%3E%3C/svg%3E" />
  </head>
  <body class="page">
    <!--
      Eine Seite, zwei Zustände: die Übersicht und ein einzelnes Werkzeug. Der
      Kopf bleibt derselbe und tauscht nur sein linkes Symbol — Burger auf der
      Übersicht, Pfeil zurück im Werkzeug. Welcher Zustand gilt, steht im Hash,
      damit der Zurück-Knopf des Browsers dasselbe tut wie der im Kopf.
    -->
    <header class="top">
      <button id="nav" class="top__icon" type="button" aria-label="Menü" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <button id="back" class="top__icon" type="button" aria-label="Zurück zur Übersicht" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6" /></svg>
      </button>
      <h1 id="title" class="top__title">Werkzeuge</h1>
      <div id="hands" class="seg top__seg" role="group" aria-label="Boxhand" hidden>
        <button type="button" data-hand="off">Hand aus</button>
        <button type="button" data-hand="grip">In der Hand</button>
        <button type="button" data-hand="tool">Am Werkzeug</button>
      </div>
    </header>

    <nav id="drawer" class="drawer" hidden>
      <a class="drawer__link" href="./">VR Spielwiese</a>
      <a class="drawer__link" href="./#portal">Portal Labor</a>
      <a class="drawer__link" href="./#tune">Eingaberaum</a>
      <a class="drawer__link drawer__link--out" href="https://github.com/baumgartner-games/vr">Quellcode</a>
      <p class="drawer__note">Mehr kommt hierher, sobald es da ist.</p>
    </nav>

    <main class="main">
      <ul id="grid" class="grid" aria-label="Alle Werkzeuge"></ul>

      <section id="detail" class="detail" hidden>
        <div class="stage"><canvas id="stage" class="stage__canvas"></canvas></div>
        <div class="detail__foot">
          <p id="hint" class="detail__hint"></p>
          <p class="detail__help">Ziehen dreht · zwei Finger oder Rad zoomen · Doppeltipp stellt zurück</p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/tools/main.ts"></script>
  </body>
</html>
